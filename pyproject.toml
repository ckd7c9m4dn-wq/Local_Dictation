[project]
name = "local-dictation"
version = "0.1.0"
description = "Private, fully-local voice dictation for macOS — a Wispr Flow alternative that never sends audio off your machine"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "parakeet-mlx>=0.5.2",
    "pynput>=1.8.2",
    "requests>=2.34.2",
    "rumps>=0.4.0",
    "sounddevice>=0.5.5",
]

[project.scripts]
local-dictation = "local_dictation.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_dictation"]
